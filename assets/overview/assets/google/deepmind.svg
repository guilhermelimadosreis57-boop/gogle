  <text x="600" y="735" font-family="'Courier New', monospace" font-size="10" letter-spacing="4" text-anchor="middle" fill="#7928CA" opacity="0.8">200M+ PROTEIN STRUCTURES PREDICTED · NOBEL PRIZE IN CHEMISTRY 2024</text>
