  <line x1="440" y1="300" x2="360" y2="280" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="580" y1="245" x2="560" y2="480" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  <line x1="640" y1="320" x2="740" y2="300" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
