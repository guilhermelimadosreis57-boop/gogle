  <path d="M 350,600 C 400,500 380,380 440,300 C 500,220 580,240 640,320 C 700,400 680,520 760,560 C 840,600 900,450 920,300" fill="none" stroke="#7928CA" stroke-width="8" opacity="0.65" filter="url(#glowViolet)"/>
  <path d="M 350,600 C 400,500 380,380 440,300 C 500,220 580,240 640,320 C 700,400 680,520 760,560 C 840,600 900,450 920,300" fill="none" stroke="#00DFD8" stroke-width="3" opacity="0.8" filter="url(#glowCyan)"/>
