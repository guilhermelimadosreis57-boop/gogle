<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06100a"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Android robot head -->
  <g transform="translate(600,380)" filter="url(#glow)">
    <!-- Body/torso -->
    <rect x="-110" y="60" width="220" height="180" rx="20" fill="none" stroke="#34A853" stroke-width="2" opacity="0.55"/>
    <!-- Head -->
    <rect x="-90" y="-60" width="180" height="130" rx="70" fill="none" stroke="#34A853" stroke-width="2" opacity="0.55"/>
    <!-- Antennae -->
    <line x1="-45" y1="-60" x2="-75" y2="-110" stroke="#34A853" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="-75" cy="-115" r="7" fill="#34A853" opacity="0.5"/>
    <line x1="45" y1="-60" x2="75" y2="-110" stroke="#34A853" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="75" cy="-115" r="7" fill="#34A853" opacity="0.5"/>
    <!-- Eyes -->
    <circle cx="-28" cy="-10" r="10" fill="#34A853" opacity="0.6"/>
    <circle cx="28" cy="-10" r="10" fill="#34A853" opacity="0.6"/>
    <!-- Arms -->
    <rect x="-165" y="70" width="50" height="130" rx="25" fill="none" stroke="#34A853" stroke-width="2" opacity="0.4"/>
    <rect x="115" y="70" width="50" height="130" rx="25" fill="none" stroke="#34A853" stroke-width="2" opacity="0.4"/>
    <!-- Legs -->
    <rect x="-80" y="245" width="60" height="100" rx="30" fill="none" stroke="#34A853" stroke-width="2" opacity="0.4"/>
    <rect x="20" y="245" width="60" height="100" rx="30" fill="none" stroke="#34A853" stroke-width="2" opacity="0.4"/>
  </g>
</svg>
