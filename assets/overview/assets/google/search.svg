<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Search bar mockup -->
  <rect x="200" y="300" width="800" height="70" rx="35" fill="none" stroke="#4285F4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="740" cy="335" r="18" fill="none" stroke="#4285F4" stroke-width="2" filter="url(#glow)"/>
  <line x1="752" y1="347" x2="762" y2="357" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Blinking cursor -->
  <rect x="250" y="320" width="2" height="30" fill="#4285F4" opacity="0.8"/>
  <!-- Results lines -->
  <rect x="200" y="410" width="300" height="8" rx="4" fill="#4285F4" opacity="0.25"/>
  <rect x="200" y="430" width="600" height="6" rx="3" fill="#4285F4" opacity="0.12"/>
  <rect x="200" y="448" width="500" height="6" rx="3" fill="#4285F4" opacity="0.10"/>
  <rect x="200" y="480" width="320" height="8" rx="4" fill="#EA4335" opacity="0.20"/>
  <rect x="200" y="500" width="620" height="6" rx="3" fill="#4285F4" opacity="0.10"/>
  <rect x="200" y="518" width="450" height="6" rx="3" fill="#4285F4" opacity="0.08"/>
  <!-- G logo hint -->
  <text x="600" y="200" font-family="sans-serif" font-size="120" font-weight="700" text-anchor="middle" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.07">G</text>
  <!-- Data points -->
  <circle cx="100" cy="150" r="2" fill="#4285F4" opacity="0.4"/>
  <circle cx="1100" cy="650" r="2" fill="#EA4335" opacity="0.4"/>
  <circle cx="150" cy="620" r="1.5" fill="#FBBC05" opacity="0.4"/>
  <circle cx="1050" cy="180" r="1.5" fill="#34A853" opacity="0.4"/>
  <!-- Connecting lines -->
  <line x1="100" y1="150" x2="200" y2="335" stroke="#4285F4" stroke-width="0.5" opacity="0.15"/>
  <line x1="1100" y1="650" x2="800" y2="335" stroke="#EA4335" stroke-width="0.5" opacity="0.15"/>
</svg>
