<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Central Alphabet Core -->
  <circle cx="600" cy="400" r="70" fill="#0c172a" stroke="#4285F4" stroke-width="2.5" opacity="0.9" filter="url(#glow)"/>
  <text x="600" y="408" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Alphabet</text>
  <!-- Orbiting Nodes: Subsidiaries / Ventures -->
  <!-- Google Search & Platforms -->
  <g transform="translate(600,160)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="#131e33" stroke="#4285F4" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4285F4" text-anchor="middle">Google</text>
  </g>
  <!-- YouTube -->
  <g transform="translate(840,240)" filter="url(#glow)">
    <circle cx="0" cy="0" r="34" fill="#240f11" stroke="#EA4335" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EA4335" text-anchor="middle">YouTube</text>
  </g>
  <!-- DeepMind -->
  <g transform="translate(900,450)" filter="url(#glow)">
    <circle cx="0" cy="0" r="34" fill="#1b0f2e" stroke="#7928CA" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#00DFD8" text-anchor="middle">DeepMind</text>
  </g>
  <!-- Waymo -->
  <g transform="translate(780,630)" filter="url(#glow)">
    <circle cx="0" cy="0" r="32" fill="#0a1f19" stroke="#00C49F" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#00C49F" text-anchor="middle">Waymo</text>
  </g>
  <!-- Google Cloud -->
  <g transform="translate(420,630)" filter="url(#glow)">
    <circle cx="0" cy="0" r="34" fill="#0c172a" stroke="#4285F4" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4285F4" text-anchor="middle">Cloud</text>
  </g>
  <!-- Verily / Life Sciences -->
  <g transform="translate(300,450)" filter="url(#glow)">
    <circle cx="0" cy="0" r="32" fill="#1e1808" stroke="#FBBC05" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FBBC05" text-anchor="middle">Verily</text>
  </g>
  <!-- X (The Moonshot Factory) -->
  <g transform="translate(360,240)" filter="url(#glow)">
    <circle cx="0" cy="0" r="30" fill="#0d1f14" stroke="#34A853" stroke-width="2"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">X</text>
  </g>
  <!-- Constellation Connections -->
  <g stroke-width="1.2" opacity="0.4">
    <line x1="600" y1="330" x2="600" y2="198" stroke="#4285F4"/>
    <line x1="650" y1="350" x2="815" y2="265" stroke="#EA4335"/>
    <line x1="670" y1="400" x2="866" y2="450" stroke="#7928CA"/>
    <line x1="650" y1="450" x2="755" y2="605" stroke="#00C49F"/>
    <line x1="550" y1="450" x2="445" y2="605" stroke="#4285F4"/>
    <line x1="530" y1="400" x2="332" y2="450" stroke="#FBBC05"/>
    <line x1="550" y1="350" x2="385" y2="265" stroke="#34A853"/>
    <!-- Ring connecting outer nodes -->
    <path d="M 600,160 L 840,240 L 900,450 L 780,630 L 420,630 L 300,450 L 360,240 Z" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="5 7" opacity="0.25"/>
  </g>
  <text x="600" y="740" font-family="'Courier New', monospace" font-size="12" letter-spacing="6" text-anchor="middle" fill="#FFFFFF" opacity="0.5">ALPHABET INC. · CONSTELLATION OF INNOVATION · EST. 2015</text>
</svg>
