<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="glowGold"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowBlue"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Quantum ambient wave rings -->
  <circle cx="600" cy="400" r="320" fill="none" stroke="#4285F4" stroke-width="0.8" opacity="0.15" stroke-dasharray="8 12"/>
  <circle cx="600" cy="400" r="240" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.25"/>
  <circle cx="600" cy="400" r="160" fill="none" stroke="#FBBC05" stroke-width="1.2" opacity="0.3" filter="url(#glowGold)"/>
  <!-- Quantum Processor Die -->
  <rect x="460" y="260" width="280" height="280" rx="16" fill="#0c1220" stroke="#FBBC05" stroke-width="2.5" opacity="0.85" filter="url(#glowGold)"/>
  <!-- Qubit grid array (105 Qubits representation) -->
  <g fill="#FBBC05" opacity="0.75" filter="url(#glowGold)">
    <!-- Central qubit array -->
    <rect x="495" y="295" width="210" height="210" fill="none" stroke="#4285F4" stroke-width="1" opacity="0.4"/>
    <g transform="translate(520,320)">
      <circle cx="0" cy="0" r="4"/><circle cx="40" cy="0" r="4"/><circle cx="80" cy="0" r="4"/><circle cx="120" cy="0" r="4"/><circle cx="160" cy="0" r="4"/>
      <circle cx="0" cy="40" r="4"/><circle cx="40" cy="40" r="4"/><circle cx="80" cy="40" r="4"/><circle cx="120" cy="40" r="4"/><circle cx="160" cy="40" r="4"/>
      <circle cx="0" cy="80" r="4"/><circle cx="40" cy="80" r="4"/><circle cx="80" cy="80" r="7" fill="#4285F4" filter="url(#glowBlue)"/><circle cx="120" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
      <circle cx="0" cy="120" r="4"/><circle cx="40" cy="120" r="4"/><circle cx="80" cy="120" r="4"/><circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/>
      <circle cx="0" cy="160" r="4"/><circle cx="40" cy="160" r="4"/><circle cx="80" cy="160" r="4"/><circle cx="120" cy="160" r="4"/><circle cx="160" cy="160" r="4"/>
      <!-- Interconnect traces -->
      <line x1="0" y1="0" x2="160" y2="0" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="40" x2="160" y2="40" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="80" x2="160" y2="80" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="120" x2="160" y2="120" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="160" x2="160" y2="160" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="0" x2="0" y2="160" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="40" y1="0" x2="40" y2="160" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="80" y1="0" x2="80" y2="160" stroke="#4285F4" stroke-width="1.5" opacity="0.6"/>
      <line x1="120" y1="0" x2="120" y2="160" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
      <line x1="160" y1="0" x2="160" y2="160" stroke="#FBBC05" stroke-width="1" opacity="0.3"/>
    </g>
  </g>
  <!-- Superconducting lead traces radiating outwards -->
  <g stroke="#FBBC05" stroke-width="1.2" opacity="0.5">
    <line x1="460" y1="300" x2="300" y2="300"/><line x1="460" y1="350" x2="260" y2="350"/><line x1="460" y1="400" x2="220" y2="400"/><line x1="460" y1="450" x2="260" y2="450"/><line x1="460" y1="500" x2="300" y2="500"/>
    <line x1="740" y1="300" x2="900" y2="300"/><line x1="740" y1="350" x2="940" y2="350"/><line x1="740" y1="400" x2="980" y2="400"/><line x1="740" y1="450" x2="940" y2="450"/><line x1="740" y1="500" x2="900" y2="500"/>
    <line x1="500" y1="260" x2="500" y2="140"/><line x1="550" y1="260" x2="550" y2="110"/><line x1="600" y1="260" x2="600" y2="80"/><line x1="650" y1="260" x2="650" y2="110"/><line x1="700" y1="260" x2="700" y2="140"/>
    <line x1="500" y1="540" x2="500" y2="660"/><line x1="550" y1="540" x2="550" y2="690"/><line x1="600" y1="540" x2="600" y2="720"/><line x1="650" y1="540" x2="650" y2="690"/><line x1="700" y1="540" x2="700" y2="660"/>
  </g>
  <text x="600" y="605" font-family="'Courier New', monospace" font-size="12" letter-spacing="8" text-anchor="middle" fill="#FBBC05" opacity="0.8">GOOGLE QUANTUM AI · WILLOW</text>
  <text x="600" y="630" font-family="'Courier New', monospace" font-size="10" letter-spacing="4" text-anchor="middle" fill="#4285F4" opacity="0.6">105 QUBITS · REAL-TIME ERROR CORRECTION</text>
</svg>
