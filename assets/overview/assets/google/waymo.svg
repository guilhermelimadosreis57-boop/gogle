<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0a1017"/>
      <stop offset="100%" stop-color="#050506"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Lidar radar rings -->
  <circle cx="600" cy="450" r="100" fill="none" stroke="#00C49F" stroke-width="1.2" opacity="0.25"/>
  <circle cx="600" cy="450" r="180" fill="none" stroke="#00C49F" stroke-width="1.2" opacity="0.2" stroke-dasharray="6 6"/>
  <circle cx="600" cy="450" r="280" fill="none" stroke="#00C49F" stroke-width="1.2" opacity="0.15"/>
  <circle cx="600" cy="450" r="380" fill="none" stroke="#00C49F" stroke-width="1" opacity="0.1" stroke-dasharray="10 8"/>
  <!-- Scanning sweep beam -->
  <path d="M 600,450 L 880,240 A 380 380 0 0 0 740,110 Z" fill="#00C49F" opacity="0.08"/>
  <line x1="600" y1="450" x2="880" y2="240" stroke="#00C49F" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>
  <!-- Waymo Autonomous Vehicle Outline -->
  <g transform="translate(600,450)" filter="url(#glow)">
    <!-- Car body profile -->
    <path d="M -70,-20 Q -40,-45 0,-48 Q 40,-45 70,-20 L 85,-5 Q 90,15 80,30 L -80,30 Q -90,15 -85,-5 Z" fill="none" stroke="#00C49F" stroke-width="2" opacity="0.7"/>
    <!-- Roof sensor pod (LiDAR dome) -->
    <rect x="-15" y="-62" width="30" height="14" rx="7" fill="#00C49F" opacity="0.8"/>
    <circle cx="0" cy="-55" r="4" fill="#FFFFFF"/>
    <!-- Headlights & sensor beam -->
    <circle cx="-50" cy="0" r="6" fill="#4285F4" opacity="0.6"/>
    <circle cx="50" cy="0" r="6" fill="#4285F4" opacity="0.6"/>
  </g>
  <!-- Detected point cloud obstacles -->
  <circle cx="420" cy="280" r="5" fill="#4285F4" opacity="0.7" filter="url(#glow)"/>
  <circle cx="780" cy="310" r="5" fill="#EA4335" opacity="0.7" filter="url(#glow)"/>
  <circle cx="480" cy="560" r="4" fill="#FBBC05" opacity="0.6"/>
  <circle cx="730" cy="540" r="4" fill="#34A853" opacity="0.6"/>
  <text x="600" y="700" font-family="'Courier New', monospace" font-size="13" letter-spacing="8" text-anchor="middle" fill="#00C49F" opacity="0.6">WAYMO · AUTONOMOUS MOBILITY · LIDAR 360°</text>
</svg>
